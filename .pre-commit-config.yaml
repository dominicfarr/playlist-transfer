# npm tools run from the project's node_modules (package-lock.json), so their versions
# and config match `npm run lint/check/test`. Non-npm tools are pinned by rev below.
# Any hook that fails or modifies files stops the commit: review, `git add -u`, commit again.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint --fix
        entry: npx --no-install eslint --fix --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [javascript, ts, svelte]
        require_serial: true
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        types: [text]
        exclude: ^package-lock\.json$
      - id: svelte-check
        name: svelte-check + tsc
        entry: npm run --silent check
        language: system
        types_or: [javascript, ts, svelte, json]
        pass_filenames: false
      - id: vitest-related
        name: vitest related
        entry: npx --no-install vitest related --run --passWithNoTests
        language: system
        types_or: [javascript, ts, svelte]
      - id: commitlint
        name: commitlint
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.59.0
    hooks:
      - id: cfn-lint
        files: ^infra/.*\.ya?ml$
