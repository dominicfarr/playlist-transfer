name: CI

# Runs on every push. Trunk is `main`; other branches are only for throwaway
# experiments. The deploy job runs on `main` only, after checks pass.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # commitlint needs the pushed range

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci --ignore-scripts # no dependency install scripts run (Sonar S8544); none are needed

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install pre-commit
        # Exact version, wheels only so no setup scripts run (Sonar S8544, S8541).
        # Match the version in the README's Development setup; bump both together.
        run: uv tool install --no-build pre-commit==4.7.0

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: All pre-commit hooks on every file
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Lint commit messages in this push
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Normal push: every commit the push added.
            npx --no-install commitlint --from "$BEFORE" --to "$HEAD_SHA" --verbose
          elif [ "$REF_NAME" != "main" ] && git rev-parse -q --verify origin/main >/dev/null; then
            # New branch: every commit not already on main.
            npx --no-install commitlint --from "$(git merge-base origin/main "$HEAD_SHA")" --to "$HEAD_SHA" --verbose
          else
            # First push of main (or history rewritten): no range to compare, lint the head commit.
            npx --no-install commitlint --last --verbose
          fi

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep the build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to playlist.domfarr.com
    needs: checks
    # The deploy role trusts only refs/heads/main. No `environment:` here:
    # it changes the OIDC subject and the role would refuse it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A first deploy waits on certificate validation and distribution rollout.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      STACK_NAME: playlist-transfer
      HOSTED_ZONE_ID: Z03722621B6AEUR5NOSKX # domfarr.com (ADR 0002)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch the build artifact from checks
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist/

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy the stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/template.yml \
            --parameter-overrides "HostedZoneId=$HOSTED_ZONE_ID" \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack
        run: |
          output() {
            local key="$1"
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$key'].OutputValue" --output text
          }
          {
            echo "bucket=$(output BucketName)"
            echo "distribution=$(output DistributionId)"
            echo "url=$(output SiteUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Sync the site to S3
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          # Hashed assets never change; everything else is revalidated.
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Clear the CloudFront cache
        env:
          DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
        run: |
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths '/*' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      - name: Smoke check the live site
        env:
          SITE_URL: ${{ steps.stack.outputs.url }}
        run: infra/smoke.sh "$SITE_URL"
