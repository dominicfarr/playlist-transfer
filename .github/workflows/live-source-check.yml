name: Live Source Playlist check

# Early warning that Spotify has changed its embed page (ADR 0001). Reads the
# example playlist from live Spotify through the Transfer core and the real
# Spotify embed port. Manual-only for now: run it from the Actions tab or
# with `gh workflow run live-source-check.yml --ref main`.
on:
  workflow_dispatch:
    inputs:
      share_link:
        description: Share Link to check (blank for the example playlist)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: live-source-check
  cancel-in-progress: false

jobs:
  live-source-check:
    name: Read the live Source Playlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci --ignore-scripts # no dependency install scripts run (Sonar S8541); none are needed

      - name: Live Source Playlist check
        env:
          LIVE_CHECK_SHARE_LINK: ${{ inputs.share_link }}
        run: npm run check:live
