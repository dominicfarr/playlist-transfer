sonar.projectKey=dominicfarr_playlist-transfer
sonar.organization=dominicfarr

sonar.sources=src,infra,.github
sonar.tests=src,infra
sonar.test.inclusions=**/*.test.ts,**/*.live.ts
# Tests live beside the code, so keep them out of the sources (a file can't be indexed twice)
sonar.exclusions=src/lib/transfer/fixtures/**,**/*.test.ts,**/*.live.ts

# Saved Spotify embed pages are test data, not code
sonar.cpd.exclusions=src/lib/transfer/fixtures/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Same list as test.coverage.exclude in vite.config.ts; keep the two in step.
# The Svelte UI and its entry point are checked by hand in V1 (spec #1, Testing Decisions);
# the real Spotify adapter is exercised by the live Source Playlist check rather than unit tests.
sonar.coverage.exclusions=src/**/*.svelte,src/main.ts,src/lib/spotify-embed-fetch.ts

# Fail the workflow run when the quality gate fails
sonar.qualitygate.wait=true

# Reviewed decisions on infra/template.yml (developer-approved, see ticket #15):
# - S6258 (no S3 access logging, no CloudFront logging): the app stores nothing about the people
#   using it (spec #1). Access logs would record visitors' IP addresses and the Share Links they
#   paste, so logging is deliberately off.
# - S6252 (no S3 versioning): the bucket only holds the static build, which every deploy recreates
#   from git (sync --delete). Old versions add cost and nothing to restore from.
sonar.issue.ignore.multicriteria=s6258,s6252
sonar.issue.ignore.multicriteria.s6258.ruleKey=cloudformation:S6258
sonar.issue.ignore.multicriteria.s6258.resourceKey=infra/template.yml
sonar.issue.ignore.multicriteria.s6252.ruleKey=cloudformation:S6252
sonar.issue.ignore.multicriteria.s6252.resourceKey=infra/template.yml
