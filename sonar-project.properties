sonar.projectKey=dominicfarr_playlist-transfer
sonar.organization=dominicfarr

sonar.sources=src,infra,.github
sonar.tests=src,infra
sonar.test.inclusions=**/*.test.ts,**/*.live.ts
# Tests live beside the code, so keep them out of the sources (a file can't be indexed twice)
sonar.exclusions=src/lib/transfer/fixtures/**,**/*.test.ts,**/*.live.ts

# Saved Spotify embed pages are test data, not code
sonar.cpd.exclusions=src/lib/transfer/fixtures/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Same list as test.coverage.exclude in vite.config.ts; keep the two in step.
# The Svelte UI and its entry point are checked by hand in V1 (spec #1, Testing Decisions);
# the real Spotify adapter is exercised by the live Source Playlist check rather than unit tests.
sonar.coverage.exclusions=src/**/*.svelte,src/main.ts,src/lib/spotify-embed-fetch.ts

# Fail the workflow run when the quality gate fails
sonar.qualitygate.wait=true
